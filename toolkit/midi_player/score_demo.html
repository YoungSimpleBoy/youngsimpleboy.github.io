<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI 五线谱查看器</title>
  <link rel="stylesheet" href="css/toolkit-shared.css">
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <script src="https://unpkg.com/@tonejs/midi"></script>
  <script src="https://www.verovio.org/javascript/develop/verovio-toolkit-wasm.js" defer></script>
  <style>
    .page-wrapper { width: 95%; max-width: 1440px; }

    /* Controls bar */
    .controls-bar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    #fileInput { display: none; }
    .btn-upload {
      background: rgba(102,126,234,0.12);
      color: var(--text-primary);
      border: 1px solid rgba(102,126,234,0.35);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-upload:hover { background: rgba(102,126,234,0.25); }
    select.ctrl-select {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .sep { color: var(--text-secondary); font-size: 12px; }
    .ctrl-label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 22px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-left: auto;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Status */
    #statusMsg {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      min-height: 20px;
    }

    /* Score info bar */
    #scoreInfoBar {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .score-info-badge {
      background: rgba(102,126,234,0.10);
      border: 1px solid rgba(102,126,234,0.28);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .score-info-badge .info-label {
      font-weight: 600;
      color: var(--text-primary);
      margin-right: 3px;
    }

    /* Score container */
    .score-outer {
      background: #fff;
      border-radius: 10px;
      padding: 20px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 200px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      position: relative;
    }
    .score-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: #bbb;
      font-size: 14px;
    }
    #scoreContainer svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Verovio SVG colors are normalized to currentColor in score_demo.js. */
    #scoreContainer {
      --score-ink: #e8e8e8;
      color: var(--score-ink);
    }
    body.light #scoreContainer {
      --score-ink: #111;
      color: var(--score-ink);
    }
    body:not(.light) .score-outer {
      background: #181818;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    #scoreContainer svg {
      color: var(--score-ink);
    }
    body:not(.light) #scoreContainer svg [fill="#000" i],
    body:not(.light) #scoreContainer svg [fill="#000000" i],
    body:not(.light) #scoreContainer svg [fill="black" i],
    body:not(.light) #scoreContainer svg [style*="fill:#000" i],
    body:not(.light) #scoreContainer svg [style*="fill: #000" i],
    body:not(.light) #scoreContainer svg [style*="fill:black" i],
    body:not(.light) #scoreContainer svg [style*="fill: black" i],
    body:not(.light) #scoreContainer svg [style*="fill:rgb(0,0,0)" i],
    body:not(.light) #scoreContainer svg [style*="fill: rgb(0,0,0)" i] {
      fill: var(--score-ink) !important;
    }
    body:not(.light) #scoreContainer svg [stroke="#000" i],
    body:not(.light) #scoreContainer svg [stroke="#000000" i],
    body:not(.light) #scoreContainer svg [stroke="black" i],
    body:not(.light) #scoreContainer svg [style*="stroke:#000" i],
    body:not(.light) #scoreContainer svg [style*="stroke: #000" i],
    body:not(.light) #scoreContainer svg [style*="stroke:black" i],
    body:not(.light) #scoreContainer svg [style*="stroke: black" i],
    body:not(.light) #scoreContainer svg [style*="stroke:rgb(0,0,0)" i],
    body:not(.light) #scoreContainer svg [style*="stroke: rgb(0,0,0)" i] {
      stroke: var(--score-ink) !important;
    }

    /* Playback and paging */
    .playback-bar {
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }
    .playback-bar.visible { display: flex; }
    .playback-btn,
    .page-btn {
      background: rgba(102,126,234,0.12);
      color: var(--text-primary);
      border: 1px solid rgba(102,126,234,0.35);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .playback-btn:hover:not(:disabled),
    .page-btn:hover:not(:disabled) {
      background: rgba(102,126,234,0.25);
    }
    .playback-btn:disabled,
    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .progress-bar {
      flex: 1 1 260px;
      min-width: 160px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    #timeDisplay,
    #pageIndicator {
      color: var(--text-secondary);
      font-size: 12px;
      white-space: nowrap;
    }
    .page-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    #scoreContainer {
      transition: opacity 0.08s ease;
    }
    #scoreContainer.page-fade {
      opacity: 0;
    }
    #scoreContainer .note-active,
    #scoreContainer .note-active * {
      color: var(--accent) !important;
      fill: var(--accent) !important;
      stroke: var(--accent) !important;
    }

    @media (max-width: 640px) {
      .playback-bar {
        align-items: stretch;
      }
      .progress-bar {
        flex-basis: 100%;
        order: 2;
      }
      #timeDisplay {
        order: 3;
      }
      .page-controls {
        width: 100%;
        justify-content: center;
        margin-left: 0;
        order: 4;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="header">
      <h1>MIDI 五线谱查看器</h1>
      <nav class="header-actions toolkit-page-nav" aria-label="MIDI 工具导航">
        <a class="toolkit-nav-link" href="index.html">可视化播放器</a>
        <a class="toolkit-nav-link" href="score_demo.html" aria-current="page">五线谱工具</a>
        <a class="toolkit-nav-link" href="piano.html">模拟钢琴</a>
        <button class="toolkit-theme-toggle" id="themeToggle" type="button" title="切换主题" aria-label="切换主题">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </nav>
    </div>

    <div class="controls-bar">
      <input type="file" id="fileInput" accept=".mid,.midi">
      <button class="btn-upload" onclick="document.getElementById('fileInput').click()">上传 MIDI 文件</button>
      <span class="sep">或</span>
      <select class="ctrl-select" id="exampleSelect">
        <option value="">选择示例...</option>
        <option value="example_midi/example01.mid">示例 1</option>
        <option value="example_midi/example02.mid">示例 2</option>
        <option value="example_midi/example03.mid">示例 3</option>
        <option value="example_midi/example04.mid">示例 4</option>
        <option value="example_midi/example05.mid">示例 5</option>
      </select>
      <span class="sep">｜</span>
      <span class="ctrl-label">音轨：</span>
      <select class="ctrl-select" id="trackSelect" disabled>
        <option value="">加载文件后显示...</option>
      </select>
      <span class="sep">｜</span>
      <label class="ctrl-label" style="display:flex;align-items:center;gap:4px;cursor:pointer;">
        <input type="checkbox" id="pianoMode"> 钢琴谱模式
      </label>
      <span class="ctrl-label piano-opt" id="splitLabel" style="display:none">分割点：</span>
      <select class="ctrl-select piano-opt" id="splitSelect" style="display:none">
        <option value="60" selected>C4 (中央C)</option>
        <option value="55">G3</option>
        <option value="57">A3</option>
        <option value="62">D4</option>
        <option value="64">E4</option>
      </select>
      <button class="btn-primary" id="renderBtn" disabled>渲染五线谱</button>
    </div>

    <p id="statusMsg">请上传 MIDI 文件或选择示例</p>

    <div id="scoreInfoBar">
      <span class="score-info-badge" id="infoInstrument"></span>
      <span class="score-info-badge" id="infoKey"></span>
      <span class="score-info-badge" id="infoTimeSig"></span>
      <span class="score-info-badge" id="infoBpm"></span>
    </div>

    <div class="score-outer" id="scoreOuter">
      <div class="score-empty" id="scoreContainer">
        <span>五线谱将在此显示</span>
      </div>
    </div>

    <div class="playback-bar" id="playbackBar">
      <button class="playback-btn" id="playBtn" type="button">▶ 播放</button>
      <button class="playback-btn" id="stopBtn" type="button" disabled>■ 停止</button>
      <input
        class="progress-bar"
        id="progressBar"
        type="range"
        min="0"
        max="1000"
        value="0"
        step="1"
        aria-label="播放进度"
      >
      <span id="timeDisplay">0:00 / 0:00</span>
      <div class="page-controls">
        <button class="page-btn" id="prevPageBtn" type="button" disabled>上一页</button>
        <span id="pageIndicator">1 / 1</span>
        <button class="page-btn" id="nextPageBtn" type="button" disabled>下一页</button>
      </div>
    </div>
  </div>
